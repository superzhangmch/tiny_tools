<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b2118">
<title>五子棋 · CNN</title>
<style>
  :root { --bg:#2b2118; --panel:#3a2e22; --text:#f3e9d8; --muted:#b9a88f; --accent:#e0a84a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; }
  body { padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
  #app { max-width: 1040px; margin: 0 auto; padding: 8px 0 24px; }
  h1 { font-size: 18px; margin: 6px 2px 2px; font-weight: 600; }
  #status { min-height: 24px; margin: 4px 2px 8px; font-size: 16px; }
  #status .dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; border:1px solid #0006; }
  #boards { display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:14px; }
  #boardwrap, #miniwrap { display:flex; flex-direction:column; align-items:center; }
  #heatseg { display:flex; gap:6px; margin-bottom:8px; width:100%; max-width:340px; }
  #heatseg button { flex:1; padding:8px 4px; font-size:13.5px; }
  #heatseg button.on { background:var(--accent); color:#2b1d06; }
  #minicap { margin-top:6px; font-size:12.5px; line-height:1.5; color:var(--muted); text-align:center; max-width:340px; }
  #minicap b { color:var(--text); }
  .legend { display:inline-block; width:90px; height:8px; vertical-align:middle; border-radius:4px; background:linear-gradient(90deg, hsla(55,95%,48%,.2), hsla(28,95%,48%,.6), hsla(0,95%,48%,.95)); }
  canvas { touch-action: none; border-radius: 8px; box-shadow: 0 6px 24px #0008; max-width:100%; }
  #evalrow { display:flex; align-items:center; gap:8px; margin:10px 2px 0; font-size:13px; color:var(--muted); }
  #evalbar { flex:1; height:8px; background:#1d160f; border-radius:4px; overflow:hidden; }
  #evalfill { height:100%; width:50%; background:var(--accent); transition: width .3s; }
  #controls { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; margin:12px 0 8px; }
  button { padding:12px 6px; font-size:15px; border:0; border-radius:10px; background:var(--panel); color:var(--text); font-weight:500; }
  button:active { background:#4b3b2a; }
  button.primary { background:var(--accent); color:#2b1d06; }
  button:disabled { opacity:.45; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 2px; font-size:14px; }
  select { flex:1; padding:10px; font-size:15px; border-radius:10px; border:0; background:var(--panel); color:var(--text); }
  label.chk { display:flex; align-items:center; gap:8px; }
  input[type=checkbox] { width:20px; height:20px; accent-color: var(--accent); }
  #info { margin:12px 2px 0; font-size:12.5px; line-height:1.55; color:var(--muted); }
  #info b { color:var(--text); font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <h1>五子棋 · CNN <span style="font-size:12px;color:var(--muted);font-weight:400">自由规则：连成五子或更多即胜</span></h1>
  <div id="status">正在加载模型…</div>
  <div id="boards"><div id="boardwrap"><canvas id="board"></canvas></div><div id="miniwrap"><div id="heatseg"><button id="hvMine" class="on">我面对的局面</button><button id="hvAi">AI 为什么这么下</button></div><canvas id="mini"></canvas><div id="minicap"></div></div></div>
  <div id="evalrow"><span>AI 自评胜率</span><div id="evalbar"><div id="evalfill"></div></div><span id="evaltext">—</span></div>
  <div id="controls">
    <button id="newBlack" class="primary">新局 · 我执黑</button>
    <button id="newWhite">新局 · 我执白</button>
    <button id="undo">悔棋</button>
  </div>
  <div class="row"><span>强度</span>
    <select id="level">
      <option value="0" selected>快速 · 纯 CNN（默认）</option>
      <option value="16">中等 · CNN + MCTS 16</option>
      <option value="48">较强 · CNN + MCTS 48</option>
      <option value="128">最强 · CNN + MCTS 128（慢）</option>
    </select>
  </div>
  <div class="row"><label class="chk"><input type="checkbox" id="basic"> 基础规则：AI 能成五就成五，对方有四就堵（关掉就是纯网络）</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="showheat" checked> 显示小棋盘热力图（CNN 的落点概率，想自己下可关）</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="confirm"> 点两次确认落子（防误触，手机上建议开）</label></div>
  <div id="info"></div>
</div>
<script src="app.js"></script>
</body>
</html>
