<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<title>俄罗斯方块 · AI 与人</title>
<style>
  :root { --bg:#14161c; --panel:#222630; --text:#e8eaf0; --muted:#98a0b3; --accent:#4cc9f0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif; }
  body { padding: env(safe-area-inset-top) 10px env(safe-area-inset-bottom); }
  #app { max-width: 820px; margin: 0 auto; padding: 8px 0 24px; }
  h1 { font-size: 18px; margin: 6px 2px 2px; font-weight: 600; }
  h1 small { font-size:12px; color:var(--muted); font-weight:400; }
  #status { min-height: 20px; margin: 2px 2px 6px; font-size: 14px; color: var(--muted); }
  #stage { display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:14px; }
  #left { display:flex; flex-direction:column; align-items:center; }
  canvas { border-radius: 8px; display:block; }
  #board { box-shadow: 0 6px 24px #0008; }
  #chartbox { width:100%; }
  #legend { display:flex; flex-wrap:wrap; gap:4px 12px; font-size:12px; color:var(--muted); margin-bottom:4px; min-height:18px; align-items:center; }
  #legend i { display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px; }
  #legend b { color:var(--text); font-weight:600; }
  #chart { background:#0c0e12; border-radius:8px 8px 0 0; margin-bottom:2px; }
  #touch { display:none; grid-template-columns: repeat(6, 1fr); gap:6px; margin-top:10px; width:100%; }
  body.human #touch { display:grid; }
  #touch button { padding:14px 0; font-size:20px; }
  #panel { flex:1; min-width:230px; max-width:310px; }
  .seg { display:grid; grid-template-columns: 1fr 1fr; gap:6px; margin-bottom:10px; }
  .seg button.on { background:var(--accent); color:#06222c; }
  .stat { display:grid; grid-template-columns: 1fr auto; gap:4px 10px; background:var(--panel); border-radius:10px; padding:10px 12px; font-size:14px; }
  .stat span:nth-child(odd) { color:var(--muted); }
  .stat span:nth-child(even) { text-align:right; font-variant-numeric: tabular-nums; font-weight:600; }
  #nextrow { display:flex; align-items:center; gap:10px; margin:10px 0; color:var(--muted); font-size:13px; }
  #next { box-shadow:none; background:var(--panel); border-radius:8px; }
  #controls { display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin:10px 0; }
  button { padding:11px 6px; font-size:15px; border:0; border-radius:10px; background:var(--panel); color:var(--text); font-weight:500; }
  button:active { background:#2f3544; }
  button:disabled { opacity:.4; }
  button.primary { background:var(--accent); color:#06222c; }
  .row { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:14px; }
  select { flex:1; padding:9px; font-size:15px; border-radius:10px; border:0; background:var(--panel); color:var(--text); }
  label.chk { display:flex; align-items:center; gap:8px; }
  input[type=checkbox] { width:20px; height:20px; accent-color: var(--accent); flex:none; }
  body.human .aionly { display:none !important; }
  body:not(.human) .humanonly { display:none !important; }
  #info { margin:12px 2px 0; font-size:12.5px; line-height:1.6; color:var(--muted); }
  #info b { color:var(--text); font-weight:600; }
</style>
</head>
<body>
<div id="app">
  <h1>俄罗斯方块 · AI 与人 <small>20×10，真实规则：SRS 旋转 + 踢墙</small></h1>
  <div id="status">正在加载模型…</div>
  <div id="stage">
    <div id="left">
      <div id="chartbox"><div id="legend"></div><canvas id="chart"></canvas></div>
      <canvas id="board"></canvas>
      <div id="touch">
        <button data-k="left">◀</button><button data-k="right">▶</button><button data-k="ccw">⟲</button><button data-k="cw">⟳</button><button data-k="down">▼</button><button data-k="drop">⤓</button>
      </div>
    </div>
    <div id="panel">
      <div class="seg"><button id="modeAI" class="on">AI 玩</button><button id="modeHuman">我来玩</button></div>
      <div class="stat">
        <span>局数</span><span id="sGame">1</span>
        <span>已放方块</span><span id="sPieces">0</span>
        <span>已消行数</span><span id="sLines">0</span>
        <span>效率（行/块 ÷ 0.4）</span><span id="sEff">—</span>
        <span>四消（Tetris）</span><span id="sTet">0</span>
        <span>当前最高列</span><span id="sH">0</span>
        <span>候选数 / 决策耗时</span><span id="sCand">—</span>
        <span>此刻落点评分 / 最高</span><span id="sScore">—</span>
      </div>
      <div id="nextrow"><span>下一块</span><canvas id="next" width="88" height="56"></canvas></div>
      <div id="controls">
        <button id="pause" class="primary">暂停</button>
        <button id="restart">新的一局</button>
      </div>
      <div class="row aionly"><span>速度</span>
        <select id="speed">
          <option value="0.5">慢 0.5×</option><option value="1" selected>正常 1×</option><option value="2">快 2×</option><option value="4">很快 4×</option><option value="0">最快（不播放动画）</option>
        </select>
      </div>
      <div class="row humanonly"><span>下落</span>
        <select id="gravity">
          <option value="0" selected>回合制（不自动下落）</option><option value="1000">慢 1 秒/格</option><option value="500">中 0.5 秒/格</option><option value="200">快 0.2 秒/格</option>
        </select>
      </div>
      <div class="row humanonly"><button id="aiStep" style="flex:1">让 AI 走这一步</button></div>
      <div class="row"><label class="chk"><input type="checkbox" id="showchart" checked> 显示 AI 评分曲线（盘面上方）</label></div>
      <div class="row"><label class="chk"><input type="checkbox" id="showcand"> 在盘面上显示所有候选落点（越亮 = 评分越高）</label></div>
      <div class="row humanonly"><label class="chk"><input type="checkbox" id="hint"> 在盘面上标出 AI 的最佳落点</label></div>
    </div>
  </div>
  <div id="info"></div>
</div>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
