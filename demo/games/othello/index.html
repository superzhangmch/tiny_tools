<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>黑白棋：和小 CNN 对弈</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Helvetica,Arial,sans-serif;background:#fff;color:#222;padding:6px;max-width:560px;margin:auto}
.note{color:#667;font-size:12px}#msg{font-size:14px;font-weight:600;margin:2px 0}#msg:empty{display:none}
button,select{background:#fff;color:#222;border:1px solid #bbb;border-radius:6px;padding:6px 8px;font-size:13px}button:disabled{opacity:.45}
#wrap{width:min(100%,calc((100vh - 130px) / 1.75));margin:0 auto}#board{width:100%;display:block;border-radius:8px;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}.row select{flex:1;min-width:130px}.row button{flex:0 0 auto}
.bar{height:12px;border-radius:6px;background:#cfd3da;overflow:hidden;position:relative;margin-top:4px}.bar i{position:absolute;left:0;top:0;bottom:0;background:#222}
#score{font-size:15px;font-weight:600}.under{display:flex;gap:8px;align-items:flex-start;margin-top:6px}.left{flex:0 0 56%;width:56%}#mini{width:100%;display:block;background:#fff;border:1px solid #ccc;border-radius:6px}.ctl{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}.ctl select,.ctl button{width:100%}.ctl .two{display:flex;gap:5px}.ctl label{font-size:12px;color:#444}
.seg{display:flex;gap:6px;margin-top:6px}.seg button{flex:1;font-size:14px;padding:7px 8px}.seg button.on{background:#1565c0;color:#fff;border-color:#1565c0}.seg select{flex:1}
#toplist{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:6px;font-size:13px}#toplist .it{display:flex;gap:6px;align-items:center;border-bottom:1px solid #eee}#toplist .it b{min-width:18px;text-align:center;color:#fff;border-radius:3px;font-size:11px;line-height:18px}#toplist .it span{flex:1}#toplist .it i{font-style:normal;color:#555}#toplist .pick{font-weight:700}
</style></head><body>
<div id="wrap">
 <div id="msg"></div>
 <svg id="board" viewBox="0 0 400 400"></svg>
 <div class="row"><span id="score">黑 2　白 2</span><span class="note" id="ev" style="flex:1;text-align:right"></span></div>
 <div class="bar"><i id="evb" style="width:50%"></i></div>
 <div class="under">
  <div class="left"><svg id="mini" viewBox="0 0 220 220"></svg><div class="seg"><button id="vme" class="on" title="当前局面：网络建议我怎么走">我</button><button id="vai" disabled title="AI 为什么走了刚才那一步">对方</button></div></div>
  <div class="ctl">
   <div class="two"><button id="new">新局</button><button id="undo">悔棋</button><button id="hcap" title="让子：先给自己加几颗子，再点“开始”对弈，看能不能赢">让子</button></div>
   <select id="model"><option value="multi" selected>模型 multi（多输出）</option><option value="v">模型 V（只预测价值）</option></select>
   <select id="side"><option value="1">我执黑（先手）</option><option value="-1">我执白</option></select>
   <select id="mode"><option value="raw" selected>1 纯 CNN（不加规则）</option><option value="rules">2 CNN + 走法规则</option><option value="s2">3 搜索 2 层</option><option value="s3">3 搜索 3 层</option><option value="s4">3 搜索 4 层（慢）</option></select>
   <select id="metric"><option value="policy">排序/着色：网络概率</option><option value="value">排序/着色：走完后评分</option></select>
   <label id="exlabel" title="只在“3 搜索”档、棋盘只剩 8 个空位时起作用：剩下的棋用规则精确算完（不再用网络估计）"><input id="exact" type="checkbox"> 残局精确求解（仅搜索档）</label><div class="note" id="exnote"></div>
   <label id="dbglabel" title="对比网络的合法头和规则：多报/漏报的格子在小棋盘上用虚线方框标出"><input id="dbg" type="checkbox"> 合法头 vs 规则</label><div class="note" id="dbgnote"></div>
  </div>
 </div>
 <div id="toplist"></div>
 <div class="note" id="info" style="margin-top:6px"></div>
 <div class="note" id="foot" style="margin-top:6px">两个小 CNN（int8，各不到 1 MB），推理、规则、搜索都在你的浏览器里运行。multi = 一个网络同时输出落子概率、价值、合法头；V = 只输出局面价值，走棋时规则给出落子后的局面，选评分最高的。纯 CNN = 网络自己选格子，选到不合法的格子时会被指出并改选；搜索 = 用网络给叶子打分的剪枝搜索。</div>
</div>
<script>
window.OTH_API = (function () { const w = new Worker('worker.js'); let n = 0; const pend = {};
  w.onmessage = (e) => { const p = pend[e.data.id]; delete pend[e.data.id]; if (e.data.error) p[1](new Error(e.data.error)); else p[0](e.data.result); };
  return (kind, body) => new Promise((res, rej) => { const i = ++n; pend[i] = [res, rej]; w.postMessage({ id: i, kind, body }); }); })();
</script><script src="oth.js"></script><script src="app.js"></script></body></html>
