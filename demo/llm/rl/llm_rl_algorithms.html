<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root {

  }
  * { box-sizing: border-box; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }

  .resp.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .resp.dropped { opacity: .35; }
  .resp.dropped::after { content: "零方差组 → 丢弃重采"; position: absolute; right: 10px; color: var(--red); font-weight: 600; }
  .rid { font-family: var(--mono); color: var(--muted); width: 22px; }

  .tok.zero { background: repeating-linear-gradient(45deg, #eceef2, #eceef2 4px, #f8f9fb 4px, #f8f9fb 8px); color: #8a91a0; }
  .tok.rare { border-color: var(--purple); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .score { font-family: var(--mono); font-weight: 700; min-width: 64px; text-align: right; animation: stamp .3s ease-out; }

  @keyframes stamp { from { transform: scale(2.2) rotate(-12deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #f3eefe; color: var(--purple); white-space: nowrap; }
  .note { background: #fff8e6; border-left: 3px solid var(--amber); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }
  .key { background: #eef8f1; border-left: 3px solid var(--green); padding: 8px 12px; border-radius: 4px; margin: 10px 0; }

  /* 公式 */
  .formula { font-family: "Times New Roman", serif; font-size: 18px; background: #f8f9fb; border-radius: 8px; padding: 10px 14px;
    overflow-x: auto; white-space: nowrap; margin: 8px 0; }
  .formula i { font-style: italic; }
  .hl1 { background: #ffe9a8; border-radius: 3px; padding: 0 2px; }
  .hl2 { background: #d6e6ff; border-radius: 3px; padding: 0 2px; }
  .hl3 { background: #ffd6d6; border-radius: 3px; padding: 0 2px; }
  .steps { counter-reset: s; padding-left: 0; list-style: none; margin: 6px 0; }
  .steps li { counter-increment: s; margin: 4px 0; padding-left: 28px; position: relative; }
  .steps li::before { content: counter(s); position: absolute; left: 0; top: 1px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--ink); color: #fff; font-size: 12px; text-align: center; line-height: 20px; }

  table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: right; font-family: var(--mono); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; background: #fafbfc; font-family: inherit; }
  td.l, th.l { text-align: left; }
  td.pos { color: var(--green); } td.neg { color: var(--red); } td.z { color: #a0a6b2; }
  tr.clipped td { background: #f6f6f8; }
  .bar { display: inline-block; height: 10px; border-radius: 2px; vertical-align: middle; }
  .bigloss { font-size: 22px; font-family: var(--mono); font-weight: 700; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin: 4px 0 8px; }
  .legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -2px; background: var(--c); }
  canvas { width: 100%; background: #fafbfc; border-radius: 8px; }
  .timeline { display: flex; gap: 0; overflow-x: auto; padding: 8px 0; }
  .tl { min-width: 150px; border-top: 3px solid var(--line); padding: 8px 10px 0; position: relative; cursor: pointer; }
  .tl::before { content: ""; position: absolute; top: -8px; left: 10px; width: 13px; height: 13px; border-radius: 50%; background: var(--c, #999); }
  .tl b { display: block; } .tl span { font-size: 12px; color: var(--muted); }
  .btn.solid { background: var(--blue); color: #fff; }
  .pipe { display: flex; align-items: stretch; gap: 4px; flex-wrap: wrap; }
  .comp { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 110px; background: #fafbfc; transition: all .2s; }
  .comp b { display: block; font-size: 14px; } .comp span { font-size: 12px; color: var(--muted); }
  .comp.unused { opacity: .35; text-decoration: line-through; }
  .comp.active { background: var(--blue); border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(47,111,237,.3); }
  .comp.active b, .comp.active span { color: #fff; }
  .arrow { align-self: center; color: var(--muted); font-size: 18px; }
  .step { border-left: 4px solid var(--line); } .step.cur { border-left-color: var(--blue); animation: pop .25s ease-out; }
  .sn { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; text-align: center; line-height: 24px; font-size: 13px; margin-right: 8px; }
  .ctag { font-size: 12px; font-weight: 400; background: #eef3fe; color: var(--blue); padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .mats { display: flex; flex-wrap: wrap; gap: 14px; }
  .matwrap { overflow-x: auto; }
  .matlabel { font-size: 13px; font-weight: 600; margin-bottom: 2px; } .shape { font-family: var(--mono); color: var(--purple); font-weight: 400; font-size: 12px; }
  table.mat { width: auto; font-size: 11px; } table.mat th, table.mat td { padding: 2px 4px; border: 1px solid #fff; text-align: center; }
  table.mat th { background: none; color: var(--muted); font-family: var(--mono); }
  td.mc { min-width: 38px; font-family: "Hiragino Sans", var(--mono); }
  td.pad { background: #eceef2; color: #b8bdc7; font-size: 10px; }
  td.dead { background: repeating-linear-gradient(45deg, #e6e8ec, #e6e8ec 3px, #f8f9fb 3px, #f8f9fb 6px); color: #9aa0ab; }
  table.ftab th { width: 190px; vertical-align: top; white-space: normal; background: #fafbfc; }
  table.ftab td.fx { white-space: normal; font-family: inherit; overflow-x: auto; max-width: 900px; }
  .ctag a { color: inherit; text-decoration: none; }
  .gp { opacity: 0; animation: gpfade .45s ease forwards; }
  @keyframes gpfade { to { opacity: 1; } }
  table.wrap td, table.wrap th { white-space: normal; }
  tr.gstart td, tr.gstart th { border-top: 2px solid #1d2330 !important; }
  th.tstep { background: #e8f0fe !important; color: #2f6fed !important; font-weight: 700; }
  th.tidx { color: #b8bdc7 !important; }
  td.gcell { background: #fff8e6; font-weight: 700; vertical-align: middle; text-align: center; }
  table.rt { width: auto; min-width: 520px; }
  .nocard h2 { color: #8a91a0; } .nocard { background: #fafbfc; }
  .mode { border-radius: 10px; padding: 10px 14px; margin: 10px 0; background: #f4f6fb; }
  .mode-multi { background: #eef3fe; } .mode-dpo { background: #fff8e6; }
  .mode p { margin: 6px 0 0; }
  .mpic { font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: #6b7385; }
  .mtok { display: inline-block; background: #fff; border: 1px solid #d5d9e2; border-radius: 5px; padding: 2px 8px; color: #1d2330; margin: 0 2px; }
  .mtok sub { color: #2f6fed; margin-left: 3px; }
  .marr { color: #2f6fed; font-weight: 700; }
  .mbox { border: 2px solid #1f9d55; border-radius: 8px; padding: 3px 6px; display: inline-flex; align-items: center; gap: 2px; }
  .mbox.bad { border-color: #d64545; }
  .mbox em { font-style: normal; font-size: 12px; color: #1f9d55; margin-left: 6px; font-weight: 700; }
  .mbox.bad em { color: #d64545; }
  .subnav { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 14px; }
  .subnav button { border: 1px solid var(--line); background: var(--card); padding: 5px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .subnav button small { color: var(--muted); margin-left: 4px; }
  .subnav button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  .subnav button.on small { color: #dbe6ff; }
  td.tail { font-weight: 700; background: #fff8e6; }
</style>
</head>
<body>
<header>
  <h1>LLM-RL 算法</h1>
  <p>PPO / DPO / GRPO / Dr.GRPO / DAPO / GSPO / CISPO / Kimi MD：族谱、训练架构，以及在同一批数据上逐步计算。所有数字都是页面里现算的玩具数据，可以拖滑块、重新采样。</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
// ============================================================
// 玩具世界: 一道题 + 回答池. 策略按 p 采样; 每个 token 的旧概率由哈希固定
// ============================================================
const PROMPT = "中国的首都是哪里？";
const REWARD_RULE = "规则奖励：用中文答出「北京」→ 1，否则 → 0";
const POOL = [
  { id: "A", toks: ["是", "北京", "。"], r: 1, p: 0.22, rm: 0.86 },
  { id: "B", toks: ["中国", "的", "首都", "是", "北京", "。"], r: 1, p: 0.18, rm: 0.92 },
  { id: "C", toks: ["The", "capital", "is", "Beijing", "."], r: 0, p: 0.15, tag: "答成英文", rm: 0.35 },
  { id: "D", toks: ["抱歉", "，", "我", "无法", "回答", "这个", "问题", "。"], r: 0, p: 0.13, tag: "乱拒答", rm: 0.12 },
  { id: "E", toks: ["嗯", "，", "等等", "…", "是", "北京", "吧", "。"], r: 1, p: 0.1, tag: "先犹豫后答对", rare: [2], rm: 0.71 },
  { id: "F", toks: ["是", "上海", "。"], r: 0, p: 0.12, tag: "答错", rm: 0.08 },
  { id: "G", toks: ["中国", "的", "首都", "嘛", "，", "历史", "上", "换过", "很多", "，", "比如", "南京", "，", "现在", "是", "…", "上海", "。"],
    r: 0, p: 0.1, tag: "又长又错", rm: 0.15 },
];

function hash(s) { // 字符串 → [0,1)
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function rng(seed) { // mulberry32
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const std = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const sigmoid = x => 1 / (1 + Math.exp(-x));
const f = (x, d = 3) => (x === undefined || Number.isNaN(x)) ? "—" : (x >= 0 ? " " : "") + x.toFixed(d);
const cls = x => Math.abs(x) < 1e-9 ? "z" : x > 0 ? "pos" : "neg";

function makeResp(item, inst) {
  return {
    ...item, inst,
    toks: item.toks.map((t, i) => {
      const isRare = (item.rare || []).includes(i);
      const p = isRare ? 0.03 + 0.03 * hash(item.id + i + "p") : 0.55 + 0.44 * hash(item.id + i + "p");
      const oldLp = Math.log(p);
      const refLp = Math.min(-0.0005, oldLp + (hash(item.id + i + "ref") - 0.5) * 0.3);
      return { t, i, oldLp, refLp, rare: isRare };
    }),
  };
}
function sampleGroup(G, seed, opts = {}) {
  const R = rng(seed);
  const pool = opts.pool || POOL;
  const tot = pool.reduce((s, x) => s + x.p, 0);
  const out = [];
  for (let g = 0; g < G; g++) {
    let u = R() * tot, k = 0;
    while (u > pool[k].p && k < pool.length - 1) { u -= pool[k].p; k++; }
    out.push(makeResp(pool[k], g));
  }
  if (opts.forceE && !out.some(x => x.id === "E")) out[out.length - 1] = makeResp(POOL[4], G - 1);
  return out;
}
// 模拟"已经做过几个 mini-batch 更新": 新 logp = 旧 logp + 漂移.
// 优势为正的 token 概率被推高, 为负被压低; 低概率 token 相对变化最大 (现实里也是它们的 ratio 最容易爆).
function drift(tok, A, amount, key) {
  const h1 = hash(key + "d1"), h2 = hash(key + "d2");
  let d = Math.sign(A) * (0.12 + 0.3 * h1) + (h2 - 0.5) * 0.25;
  if (tok.rare && A > 0) d *= 5;
  return Math.min(-0.0005, tok.oldLp + amount * d);
}

// ============================================================
// 状态与通用控件
// ============================================================
const S = {
  algo: "overview", seed: 7, G: 4, drift: 0.6, eps: 0.2, beta: 0.04, epsSeq: 0.15, dpoBeta: 0.1, palgo: "grpo", tau: 0.2, calcAlgo: "ppo",
  sel: 0, outlier: false, forceSame: false, forceE: false, animToken: 0,
  dpo: null,
};
const TABS = [
  { k: "overview", n: "总览", s: "族谱" },
  { k: "arch", n: "🏗 训练架构", s: "部署 + 数据流" },
  { k: "calc", n: "🧮 计算示例", s: "一批数据逐步算" },
];
const ALGOS = [
  { k: "ppo", n: "PPO", s: "2017 基础" },
  { k: "dpo", n: "DPO", s: "离线对比" },
  { k: "grpo", n: "GRPO", s: "组内比较" },
  { k: "drgrpo", n: "Dr.GRPO", s: "去长度偏" },
  { k: "dapo", n: "DAPO", s: "四个补丁" },
  { k: "gspo", n: "GSPO", s: "整句 ratio" },
  { k: "cispo", n: "CISPO", s: "裁权重不裁梯度" },
  { k: "kimi", n: "Kimi MD", s: "KL 当信任域" },
];
function nav() {
  document.getElementById("nav").innerHTML = TABS.map(a =>
    `<button class="${S.algo === a.k ? "on" : ""}" onclick="go('${a.k}')">${a.n}<small>${a.s}</small></button>`).join("");
}
// go(tab) 切大 tab; go(算法名) 进「计算示例」并选中该算法 (总览族谱里的点击用)
function go(k) {
  if (ALGOS.some(a => a.k === k)) { S.calcAlgo = k; k = "calc"; }
  S.algo = k; S.sel = 0; S.outlier = false; S.forceSame = false; render(true); window.scrollTo(0, 0);
}
function set(k, v) { S[k] = v; render(false); }
function reseed() { S.seed = Math.floor(Math.random() * 1e6); S.sel = 0; render(true); }
function slider(label, key, min, max, step, hint = "") {
  return `<label title="${hint}">${label}<input type="range" min="${min}" max="${max}" step="${step}" value="${S[key]}"
    oninput="set('${key}', +this.value)"><b>${S[key]}</b></label>`;
}
const models = list => `<div class="models">${[
  ["policy", "策略 π<sub>θ</sub>（在训的）"], ["old", "旧策略 π<sub>old</sub>（负责采样）"], ["ref", "参考 π<sub>ref</sub>（KL 锚点）"],
  ["rm", "奖励模型 / 规则"], ["critic", "Critic V(s)（价值网络）"], ["data", "现成偏好数据集"],
].map(([k, n]) => `<div class="model ${list.includes(k) ? "live" : "off"}">${n}</div>`).join("")}</div>`;
const promptCard = (extra = "") => `<div class="prompt"><div class="muted">prompt</div><div class="q">${PROMPT}</div>${extra}</div>`;

// 采样动画: token 一个个蹦出来, 然后盖奖励章
async function animate(token) {
  const rows = [...document.querySelectorAll(".resp[data-anim]")];
  rows.forEach(r => { r.querySelectorAll(".tok,.score,.tag").forEach(e => e.style.visibility = "hidden"); });
  const maxLen = Math.max(0, ...rows.map(r => r.querySelectorAll(".tok").length));
  for (let t = 0; t < maxLen; t++) {
    await new Promise(r => setTimeout(r, 70));
    if (token !== S.animToken) return;
    rows.forEach(r => { const k = r.querySelectorAll(".tok")[t]; if (k) { k.style.visibility = "visible"; k.style.animation = "none"; k.offsetWidth; k.style.animation = ""; } });
  }
  for (const r of rows) {
    await new Promise(res => setTimeout(res, 140));
    if (token !== S.animToken) return;
    r.querySelectorAll(".score,.tag").forEach(e => { e.style.visibility = "visible"; e.style.animation = "none"; e.offsetWidth; e.style.animation = ""; });
  }
}

// token 热力图: 颜色 = 这一步对 log π(token) 的梯度系数 (绿=推高概率, 红=压低, 斜纹=被裁掉梯度为 0)
function heat(w, maxAbs) {
  if (w === null) return "";
  if (Math.abs(w) < 1e-12) return "";
  const a = clamp(Math.abs(w) / (maxAbs || 1), 0.08, 1);
  return w > 0 ? `background: rgba(31,157,85,${a * 0.75}); color:${a > 0.55 ? "#fff" : "inherit"}`
               : `background: rgba(214,69,69,${a * 0.75}); color:${a > 0.55 ? "#fff" : "inherit"}`;
}
function respRow(resp, i, opt = {}) {
  const maxAbs = opt.maxAbs || 1;
  const toks = resp.toks.map((t, j) => {
    const w = opt.weights ? opt.weights[j] : null;
    const zero = opt.weights && opt.zeroMask && opt.zeroMask[j];
    const sub = opt.sub ? `<sub>${opt.sub(t, j)}</sub>` : "";
    return `<span class="tok ${zero ? "zero" : ""} ${t.rare ? "rare" : ""}" style="${zero ? "" : heat(w, maxAbs)}"
      title="旧概率 ${Math.exp(t.oldLp).toFixed(3)}">${t.t}${sub}</span>`;
  }).join("");

// 通用: 组内方法的逐 token 计算 (GRPO / Dr.GRPO / DAPO / CISPO 共用, 差别通过 cfg 传入)
function groupCompute(group, cfg) {
  const rewards = group.map(cfg.reward || (g => g.r));
  const m = mean(rewards), sd = std(rewards);
  const totalTok = group.reduce((s, g) => s + g.toks.length, 0);
  const rows = group.map((g, i) => {
    const R = rewards[i];
    const A = cfg.adv(R, m, sd);
    const L = g.toks.length;
    const norm = cfg.norm(L, totalTok, group.length);
    const toks = g.toks.map((t, j) => {
      let newLp = drift(t, A, S.drift, g.id + j + S.seed);
      if (S.outlier && i === 0 && j === Math.floor(L / 2)) newLp = Math.min(-0.0005, t.oldLp + Math.log(A >= 0 ? 4 : 0.25));
      const ratio = Math.exp(newLp - t.oldLp);
      const lo = 1 - cfg.epsLow, hi = 1 + cfg.epsHigh;
      const clipped = clamp(ratio, lo, hi);
      const active = !((A > 0 && ratio > hi) || (A < 0 && ratio < lo));
      const surr = Math.min(ratio * A, clipped * A);
      const x = t.refLp - newLp, kl = Math.exp(x) - x - 1; // k3 估计
      const obj = surr - (cfg.beta || 0) * kl;
      const w = (active ? ratio * A : 0) * norm;
      return { ...t, newLp, ratio, clipped, active, surr, kl, obj, w };
    });
    return { g, R, A, L, norm, toks };
  });
  return { rows, rewards, m, sd, totalTok };
}

// ---------------- Kimi MD 计算 ----------------
function kimiCompute(group) {
  const tau = S.tau, k = group.length;
  const rbar = mean(group.map(g => g.r));
  const rows = group.map(g => {
    const A = g.r - rbar;
    const toks = g.toks.map((t, j) => ({ ...t, newLp: drift(t, A, S.drift, g.id + j + S.seed) }));
    const delta = toks.reduce((s, t) => s + t.newLp - t.oldLp, 0); // log π_θ(y) − log π_θi(y), 整句求和
    const coef = A - tau * delta;                                      // ∇log π_θ(y) 的系数
    return { g, R: g.r, A, L: g.toks.length, delta, coef, norm: 1 / k,
      toks: toks.map(t => ({ ...t, ratio: Math.exp(t.newLp - t.oldLp), w: coef / k, active: true })) };
  });
  return { rows, rbar, loss: mean(rows.map(r => (r.A - tau * r.delta) ** 2)) };
}
// ---------------- 组内计算 (训练架构页的分解图用) ----------------
const PL_ALGOS = { ppo: "PPO", grpo: "GRPO", drgrpo: "Dr.GRPO", dapo: "DAPO", gspo: "GSPO", cispo: "CISPO", kimi: "Kimi MD" };
function plCompute(algo, seqs) {
  const lenPen = L => L <= 12 ? 0 : L <= 16 ? (12 - L) / 4 : -1;
  const Lmax = 20, n = seqs.length, totalTok = seqs.reduce((s, g) => s + g.toks.length, 0);
  if (algo === "ppo") {
    const beta = S.beta, eps = S.eps;
    const rows = seqs.map(g => {
      const T = g.toks.length;
      const V = g.toks.map((t, j) => clamp(g.rm * (0.35 + 0.65 * (j + 1) / T) + (hash(g.id + j + "v") - 0.5) * 0.3, -0.2, 1.1));
      const rt = g.toks.map((t, j) => -beta * (t.oldLp - t.refLp) + (j === T - 1 ? g.rm : 0));
      const A = new Array(T); let acc = 0;
      for (let j = T - 1; j >= 0; j--) { acc = rt[j] + (j + 1 < T ? V[j + 1] : 0) - V[j] + 0.95 * acc; A[j] = acc; }
      const toks = g.toks.map((t, j) => {
        const newLp = drift(t, A[j], S.drift, g.id + j + S.seed + "pl");
        const ratio = Math.exp(newLp - t.oldLp), cl = clamp(ratio, 1 - eps, 1 + eps);
        const active = !((A[j] > 0 && ratio > 1 + eps) || (A[j] < 0 && ratio < 1 - eps));
        const lossTok = -Math.min(ratio * A[j], cl * A[j]);
        return { ...t, V: V[j], rt: rt[j], A: A[j], newLp, ratio, active, lossTok, ret: A[j] + V[j] };
      });
      return { g, R: g.rm, L: T, norm: 1 / totalTok, toks };
    });
    const pLoss = rows.reduce((s, r) => s + r.toks.reduce((a, t) => a + t.lossTok, 0) * r.norm, 0);
    const vLoss = rows.reduce((s, r) => s + r.toks.reduce((a, t) => a + 0.5 * (t.V - t.ret) ** 2, 0) * r.norm, 0);
    return { rows, loss: pLoss, vLoss, totalTok };
  }
  if (algo === "kimi") {
    const k = kimiCompute(seqs);
    k.rows.forEach(r => r.toks.forEach(t => { t.A = r.A; t.coef = r.coef; t.lossTok = (r.A - S.tau * r.delta) ** 2; }));
    return { rows: k.rows, m: k.rbar, sd: std(seqs.map(g => g.r)), totalTok, loss: k.loss };
  }
  const cfg = {
    grpo: { adv: (r, m, sd) => sd < 1e-9 ? 0 : (r - m) / sd, norm: (L, tot, G) => 1 / (G * L), epsLow: 0.2, epsHigh: 0.2, beta: S.beta },
    drgrpo: { adv: (r, m) => r - m, norm: (L, tot, G) => 1 / (G * Lmax), epsLow: 0.2, epsHigh: 0.2, beta: 0 },
    dapo: { reward: g => g.r + lenPen(g.toks.length), adv: (r, m, sd) => sd < 1e-9 ? 0 : (r - m) / sd, norm: (L, tot) => 1 / tot, epsLow: 0.2, epsHigh: 0.28, beta: 0 },
    gspo: { adv: (r, m, sd) => sd < 1e-9 ? 0 : (r - m) / sd, norm: (L, tot, G) => 1 / (G * L), epsLow: 0.2, epsHigh: 0.2, beta: 0 },
    cispo: { adv: (r, m, sd) => sd < 1e-9 ? 0 : (r - m) / sd, norm: (L, tot) => 1 / tot, epsLow: 0.2, epsHigh: 0.2, beta: 0 },
  }[algo];
  const res = groupCompute(seqs, cfg);
  res.rows.forEach(r => r.toks.forEach(t => { t.A = r.A; t.lossTok = -t.obj; }));
  if (algo === "gspo") {
    const e = S.epsSeq;
    res.rows.forEach(r => {
      r.meanLog = mean(r.toks.map(t => t.newLp - t.oldLp)); r.s = Math.exp(r.meanLog);
      const active = !((r.A > 0 && r.s > 1 + e) || (r.A < 0 && r.s < 1 - e));
      r.seqLoss = -Math.min(r.s * r.A, clamp(r.s, 1 - e, 1 + e) * r.A);
      r.toks.forEach(t => { t.seqRatio = r.s; t.active = active; t.lossTok = r.seqLoss; });
    });
    return { ...res, loss: mean(res.rows.map(r => r.seqLoss)) };
  }
  if (algo === "cispo") {
    res.rows.forEach(r => r.toks.forEach(t => { t.wHat = Math.min(t.ratio, 1.28); t.active = true; t.lossTok = -t.wHat * r.A * t.newLp; }));
  }
  const loss = res.rows.reduce((s, r) => s + r.toks.reduce((a, t) => a + t.lossTok, 0) * r.norm, 0);
  return { ...res, loss };
}

function dpoCompute(seqs) {
  const b = S.dpoBeta;
  const mk = (g, sign) => {
    const toks = g.toks.map((t, j) => ({ ...t, newLp: drift({ ...t, oldLp: t.refLp }, sign, S.drift, g.id + j + S.seed + "dpo") }));

function bmat(batch, get, opt = {}) {

${i === 0 ? gcols.map(c => `<td rowspan="${g.out.rows.length}" class="gcell">${c.v(g)}</td>`).join("") : ""}</tr>`).join("")).join("")}</table>`;

const sec = (n, title, shape, body) => `<div class="card"><h2><span class="sn">${n}</span>${title}${shape ? ` <span class="shape">${shape}</span>` : ""}</h2>${body}</div>`;
const none = (n, title, why) => `<div class="card nocard"><h2><span class="sn">${n}</span>${title} <span class="ctag">本方法没有</span></h2><p class="muted">${why}</p></div>`;

// 页首: 这个方法里 RL 的"一步"是什么
function modeBanner(mode) {
  const toks = ["是", "北京", "。"];
  const tk = (t, sub) => `<span class="mtok">${t}<sub>${sub}</sub></span>`;
  const pic = {
    multi: `<div class="mpic">prompt ${toks.map((t, j) => `<span class="marr">→</span>${tk(t, "a<sub>" + (j + 1) + "</sub>")}`).join("")}</div>`,
    hybrid: `<div class="mpic">prompt <span class="marr">→</span><span class="mbox">${toks.map((t, j) => tk(t, "ρ<sub>" + (j + 1) + "</sub>")).join("")}<em>一个动作 a</em></span></div>`,
    one: `<div class="mpic">prompt <span class="marr">→</span><span class="mbox">${toks.map(t => tk(t, "")).join("")}<em>一个动作 a</em></span></div>`,
    dpo: `<div class="mpic">prompt <span class="marr">→</span><span class="mbox">${tk("是北京。", "")}<em>y<sub>w</sub></em></span> vs <span class="mbox bad">${tk("是上海。", "")}<em>y<sub>l</sub></em></span></div>`,
  }[mode];
  const txt = {
    multi: "<b>多步 RL（multi-step）：每个 token 是一步。</b>状态 s<sub>t</sub> = prompt + 前 t−1 个 token，动作 a<sub>t</sub> = 第 t 个 token，一条回答是长 T 的轨迹。所以奖励、V、优势都是<b>逐 t 不同</b>的 [n·m, T] 矩阵；下面所有矩阵的列就是 RL 时间步 t。",
    hybrid: "<b>奖励和优势按单步（one-step）：整条回答是一个动作</b>，一条回答只有一个奖励、一个优势，复制给它的每个 token。但 <b>ratio 和 clip 仍逐 token 算</b>（图中每个 token 的 ρ<sub>t</sub>），所以是混合形态。下面矩阵的列只是 token 下标，不是 RL 时间步。",
    one: "<b>彻底单步（one-step）：整条回答是一个动作。</b>奖励、优势、重要性比值（或 KL）都是整句一个。token 下标只用来把 log 概率加起来或求平均，不是 RL 时间步。",
    dpo: "<b>不是在线 RL：</b>不采样、没有奖励模型。整条回答当一个动作（contextual bandit），只比较一对现成回答的整句 log 概率。",
  }[mode];
  return `<div class="mode mode-${mode}">${pic}<p>${txt}</p></div>`;
}
function pageControls(algo) {
  const extra = { ppo: slider("ε", "eps", 0.05, 0.4, 0.05) + slider("β（KL）", "beta", 0, 0.2, 0.01), grpo: slider("ε", "eps", 0.05, 0.4, 0.05) + slider("β（KL）", "beta", 0, 0.2, 0.01),
    gspo: slider("整句 ε", "epsSeq", 0.01, 0.3, 0.01), kimi: slider("τ（KL 强度）", "tau", 0, 1, 0.05), dpo: slider("β", "dpoBeta", 0.05, 1, 0.05) }[algo] || "";
  const m = ["ppo", "dpo"].includes(algo) ? "" : slider("m（每个 prompt 采几条）", "G", 2, 6, 1);
  const same = ["ppo", "dpo"].includes(algo) ? "" : `<button class="btn warn" onclick="set('forceSame', !S.forceSame)">${S.forceSame ? "取消" : "让 p1"}全组同分</button>`;
  return `<div class="controls"><button class="btn" onclick="reseed()">🎲 重新采样</button>${m}${slider("策略已漂移", "drift", 0, 2, 0.1, "模拟已经更新过几个 mini-batch")}${extra}${same}</div>`;
}

function algoPage(algo) {
  const meta = META[algo]; PAGE_MODE = meta.mode;
  const B = buildBatch(algo);
  const m = B[0].out.rows.length, n = B.length;
  const name = ALGOS.find(a => a.k === algo).n;
  const promptList = B.map(g => `p${g.pi + 1} = 「${g.P.q}」`).join("，");
  const top = `<div class="card"><h2>${name}</h2><p class="lead">${meta.sum}</p>${modeBanner(meta.mode)}${pageControls(algo)}</div>`;
  const tokM = bmat(B, t => t.t, { label: "回答的 token", shape: algo === "dpo" ? "[n·2, T]" : `[n·m, T] = [${n * m}, T]` });
  const cards = [];

  // ① 数据
  if (algo === "dpo") {
    cards.push(sec(1, "数据：n 个 prompt × 1 对现成回答（不采样）", `n=${n}，每个 prompt 2 行`, `<p>${promptList}。每个 prompt 配一对提前准备好的回答：y<sub>w</sub>（好）、y<sub>l</sub>（坏）。训练时模型一个字都不生成。</p>${tokM}`));
  } else {
    cards.push(sec(1, `采样：n 个 prompt × m 条补全`, `n=${n}，m=${m}`, `<p>${promptList}。Rollout Model（π<sub>old</sub>）对每个 prompt 采 <b>m=${m}</b> 条${algo === "ppo" ? "（PPO 不做组内比较，每个 prompt 只采 1 条）" : "，粗线分开不同的 prompt"}。拼成 [n·m, T] 的矩阵，短的右边补 pad；同时记下每个 token 的 log π<sub>old</sub>。</p>
${tokM}${bmat(B, t => t.oldLp, { label: "log π<sub>old</sub>(y<sub>t</sub>)", neutral: true })}`));
  }

  // ② reward
  if (algo === "ppo") {
    cards.push(sec(2, "Reward：逐 token 的奖励 r<sub>t</sub>", "[n·m, T]", `<p>Reward Model 给每条回答打<b>一个分</b>，只放在最后一个 token 上；每个 token 还要扣 β·KL<sub>t</sub>（见 ④）。所以 r<sub>t</sub> = −β·KL<sub>t</sub> + [t = T]·RM 分，是一个逐 t 的矩阵。</p>
${bmat(B, t => t.rt, { label: "r<sub>t</sub>", d: 3, tail: { h: "RM 分", v: r => r.R.toFixed(2) } })}`));
  } else if (algo === "dpo") {
    cards.push(sec(2, "Reward：没有显式奖励，用隐式奖励 r̂", "[n·2]", `<p>r̂(y) = β·[log π<sub>θ</sub>(y) − log π<sub>ref</sub>(y)]，log π 是整句 token log 概率的<b>求和</b>（β = ${S.dpoBeta}）。</p>
${rtable(B, [{ h: "Σ log π<sub>θ</sub>", v: r => r.sumTh }, { h: "Σ log π<sub>ref</sub>", v: r => r.sumRef }, { h: "r̂ = β·差", v: r => r.rhat, d: 3 }])}`));
  } else {
    const dapo = algo === "dapo";
    cards.push(sec(2, "Reward：每条回答一个分", "[n·m]", `<p>规则判分（p1：${PROMPTS[0].rule}；p2：${PROMPTS[1].rule}）${dapo ? "，DAPO 再加超长惩罚（本页玩具设定：长度 &gt; 12 起扣，&gt; 16 扣满 1）" : ""}。<b>一条回答只有一个数</b>，没有逐 token 的奖励。</p>
${rtable(B, [{ h: "长度", v: r => String(r.L) }, { h: dapo ? "R = 规则分 + 超长惩罚" : "r", v: r => r.R }])}`));
  }

  // ③ value / 基线
  if (algo === "ppo") {
    cards.push(sec(3, "Value：Value Model 给每个前缀估 V(s<sub>t</sub>)", "[n·m, T]", `<p>Value Model（Critic）对每个前缀 s<sub>t</sub> 预测"从这里往后平均还能拿多少回报"。它逐 t 变化：越往后越接近这条回答的最终得分。这就是 PPO 能逐 token 分配功劳的原因。</p>
${bmat(B, t => t.V, { label: "V(s<sub>t</sub>)", neutral: true })}`));
  } else if (algo === "dpo") {
    cards.push(none(3, "Value / 基线", "没有 Value Model，也没有组内基线：一对回答互为基线，只看 y<sub>w</sub> 和 y<sub>l</sub> 的差。"));
  } else {
    const useStd = !["drgrpo", "kimi"].includes(algo);
    cards.push(sec(3, "基线：每个 prompt 各自的组内均值", "每个 prompt 一个数", `<p>没有 Value Model。<b>每个 prompt 只在自己那 m 条里</b>算均值${useStd ? "和标准差" : ""}，不跨 prompt。这个均值相当于只以 prompt 为条件的 V(s<sub>0</sub>)，所以它对整条回答只有一个值。</p>
${rtable(B, [{ h: "r", v: r => r.R }], [{ h: "组内 mean", v: g => g.out.m.toFixed(2) }].concat(useStd ? [{ h: "组内 std", v: g => g.out.sd.toFixed(2) }] : []))}
${B.some(g => g.out.sd < 1e-9) ? `<div class="note">有一组全组同分 → std = 0 → 这组的优势全是 0，没有梯度${algo === "dapo" ? "；DAPO 会把这组丢掉重采" : ""}。</div>` : ""}`));
  }

  // ④ KL
  if (algo === "ppo") {
    cards.push(sec(4, "KL：逐 token，<b>并进奖励</b>", "[n·m, T]", `<p>KL<sub>t</sub> = log π<sub>old</sub>(y<sub>t</sub>) − log π<sub>ref</sub>(y<sub>t</sub>)，参考模型是固定的初始 SFT 模型。它乘以 −β 后已经加进了 ② 的 r<sub>t</sub>，会经过 GAE 影响前面 token 的优势。</p>
${bmat(B, t => t.oldLp - t.refLp, { label: "KL<sub>t</sub>", d: 3 })}`));
  } else if (algo === "grpo") {
    cards.push(sec(4, "KL：逐 token，<b>放进 loss</b>", "[n·m, T]", `<p>对固定的 SFT 模型 π<sub>ref</sub>，用 k3 估计 π<sub>ref</sub>/π<sub>θ</sub> − log(π<sub>ref</sub>/π<sub>θ</sub>) − 1，在 ⑥ 里以 −β·KL 的形式逐 token 加进目标。它<b>不进奖励</b>，所以不影响 ③⑤ 的优势。</p>
${bmat(B, t => t.kl, { label: "KL<sub>t</sub>（k3）", d: 4, neutral: true })}`));
  } else if (algo === "kimi") {
    cards.push(sec(4, "KL：整句，对<b>上一轮策略</b> π<sub>θi</sub>", "[n·m]", `<p>锚点是本轮负责采样的模型 π<sub>θi</sub>（= π<sub>old</sub>），不是 SFT 模型，所以不需要 Reference Model。Δ = 整句 Σ<sub>t</sub>(log π<sub>θ</sub> − log π<sub>θi</sub>)，正则项是 (τ/2)·Δ²（τ = ${S.tau}），作用是限制每一步走多远。</p>
${bmat(B, t => t.newLp - t.oldLp, { label: "逐 token 的 log π<sub>θ</sub> − log π<sub>θi</sub>（加起来就是 Δ）", d: 3, tail: { h: "Δ", v: r => r.delta.toFixed(3) } })}`));
  } else if (algo === "dpo") {
    cards.push(sec(4, "KL：隐含在 β 和 π<sub>ref</sub> 里", "[n·2, T]", `<p>DPO 由"最大化奖励 − β·KL(π‖π<sub>ref</sub>)"推导而来，没有单独的 KL 项；π<sub>ref</sub> 出现在每个 token 的 log 比里。</p>
${bmat(B, t => t.lr, { label: "log π<sub>θ</sub>(y<sub>t</sub>) − log π<sub>ref</sub>(y<sub>t</sub>)", d: 3 })}`));
  } else {
    cards.push(none(4, "KL", { drgrpo: "论文全程 β = 0。", dapo: "论文去掉了 KL：长推理训练里模型本来就要大幅偏离初始模型。", gspo: "论文为简洁省略了 KL 项，没有表态要去掉。", cispo: "论文明确不用 KL。" }[algo] + "所以也不需要部署 Reference Model。"));
  }

  // ⑤ advantage
  if (algo === "ppo") {
    cards.push(sec(5, "Advantage：GAE，逐 t 不同", "[n·m, T]", `<p>δ<sub>t</sub> = r<sub>t</sub> + V(s<sub>t+1</sub>) − V(s<sub>t</sub>)，A<sub>t</sub> = δ<sub>t</sub> + γλ·A<sub>t+1</sub>（γ=1，λ=0.95，从右往左算）。同一行里每个 token 的优势都不一样。回报 R<sub>t</sub> = A<sub>t</sub> + V(s<sub>t</sub>) 是 Value Model 的训练目标。</p>
${bmat(B, t => t.A, { label: "A<sub>t</sub>", d: 3 })}${bmat(B, t => t.ret, { label: "R<sub>t</sub>（Value Model 的目标）", neutral: true })}`));
  } else if (algo === "dpo") {
    cards.push(sec(5, "Advantage：没有；每对一个权重", "[n]", `<p>margin = r̂(y<sub>w</sub>) − r̂(y<sub>l</sub>)，这一对的梯度权重是 β·(1 − σ(margin))：排得越对（margin 越大），权重越小。</p>
<table class="rt"><tr><th class="l">prompt</th><th>margin</th><th>σ(margin)</th><th>权重 β(1−σ)</th></tr>${B.map(g => `<tr><td class="l">p${g.pi + 1}</td><td>${f(g.out.margin)}</td><td>${f(sigmoid(g.out.margin))}</td><td>${f(g.out.coef)}</td></tr>`).join("")}</table>`));
  } else {
    const fm = { grpo: "(r − mean)/std", drgrpo: "r − mean", dapo: "(R − mean)/std", gspo: "(r − mean)/std", cispo: "(r − mean)/std", kimi: "r − r̄" }[algo];
    cards.push(sec(5, "Advantage：每条回答一个，再复制给每个 token", "[n·m] → [n·m, T]", `<p>A = ${fm}，每个 prompt 用自己的组内统计。一条回答只有一个 A，复制到它的所有 token 上，所以下面矩阵<b>每一行颜色完全一样</b>。${algo === "kimi" ? "Kimi 的梯度里还要减去 τΔ，见 ⑥。" : ""}</p>
${rtable(B, [{ h: "A", v: r => r.A }])}${bmat(B, (t, r) => r.A, { label: "A（复制给每个 token）" })}`));
  }

  // ⑥ 重要性采样比
  const bandLegend = (lo, hi) => `<div class="legend"><span style="--c:rgba(47,111,237,.25)">在 [${lo}, ${hi}] 内</span><span style="--c:rgba(201,138,6,.5)">超过上限 ${hi}</span>${lo > 0 ? `<span style="--c:rgba(122,76,217,.4)">低于下限 ${lo}</span>` : ""}</div>`;
  const isWhy = `<p>这批回答是 <b>π<sub>old</sub></b> 采的，但训练时会在同一批数据上切 mini-batch 连续更新好几次（DAPO 论文里每次 rollout 做 16 次梯度更新）。第一次更新时 π<sub>θ</sub> = π<sub>old</sub>，ρ = 1；之后 π<sub>θ</sub> 变了，这批数据就成了"旧策略的样本"。重要性采样用比值把期望改写成在旧分布上求：</p>
<div class="formula">E<sub>y~π<sub>θ</sub></sub>[ A ] = E<sub>y~π<sub>old</sub></sub>[ (π<sub>θ</sub>(y) / π<sub>old</sub>(y)) · A ]</div>`;
  const isPair = bmat(B, t => t.oldLp, { label: "log π<sub>old</sub>（采样时记下的）", neutral: true }) + bmat(B, t => t.newLp, { label: "log π<sub>θ</sub>（当前参数重新前向）", neutral: true });
  if (["ppo", "grpo", "drgrpo", "dapo", "cispo"].includes(algo)) {
    const eps = ["ppo", "grpo"].includes(algo) ? S.eps : 0.2;
    const [lo, hi] = algo === "dapo" ? [0.8, 1.28] : algo === "cispo" ? [0, 1.28] : [+(1 - eps).toFixed(2), +(1 + eps).toFixed(2)];
    const how = algo === "cispo" ? "CISPO 只封顶不设下限：超过 1.28 的按 1.28 算，但<b>梯度保留</b>，不会被清零。" : `超出 [${lo}, ${hi}] 且方向和 A 一致的 token，在 ⑦ 里梯度被清零（clip）。`;
    cards.push(sec(6, "重要性采样比 ρ<sub>t</sub> = π<sub>θ</sub> / π<sub>old</sub>：逐 token", "[n·m, T]", isWhy + `<p>这里<b>每个 token 各算一个</b>：ρ<sub>t</sub> = exp(log π<sub>θ</sub>(y<sub>t</sub>) − log π<sub>old</sub>(y<sub>t</sub>))。${how}拖动"策略已漂移"能看到 ρ 离 1 越来越远。</p>
${isPair}${bmat(B, t => t.ratio, { label: "ρ<sub>t</sub>", d: 3, band: [lo, hi] })}${bandLegend(lo, hi)}`));
  } else if (algo === "gspo") {
    const lo = +(1 - S.epsSeq).toFixed(2), hi = +(1 + S.epsSeq).toFixed(2);
    cards.push(sec(6, "重要性采样比：整句一个 s<sub>i</sub>", "[n·m]", isWhy + `<p>GSPO 认为逐 token 的 ρ 只有一个样本、起不到分布修正的作用，所以把它们<b>先取 log 平均再 exp</b>：s<sub>i</sub> = (π<sub>θ</sub>(y<sub>i</sub>)/π<sub>old</sub>(y<sub>i</sub>))<sup>1/|y<sub>i</sub>|</sup>。整句的 s<sub>i</sub> 超出 [${lo}, ${hi}] 且方向和 A 一致，这条回答整行被裁。</p>
${isPair}${bmat(B, t => t.ratio, { label: "逐 token 的 ρ<sub>t</sub>（只用来求几何平均）", d: 3, band: [lo, hi], tail: { h: "s<sub>i</sub>", v: r => r.s.toFixed(3) } })}${bandLegend(lo, hi)}
${rtable(B, [{ h: "A", v: r => r.A }, { h: "s<sub>i</sub>", v: r => r.s, d: 4 }, { h: "状态", v: r => r.toks[0].active ? "整句参与" : "✂ 整句裁掉" }])}`));
  } else if (algo === "kimi") {
    cards.push(none(6, "重要性采样比 π<sub>θ</sub>/π<sub>old</sub>", "Kimi MD 不用比值修正，也不 clip。它直接用 ④ 的 KL(π<sub>θ</sub>‖π<sub>θi</sub>) 限制 π<sub>θ</sub> 别离采样策略太远：τΔ 越大，⑦ 里的系数就越往回拉。"));
  } else {
    cards.push(none(6, "重要性采样比 π<sub>θ</sub>/π<sub>old</sub>", "DPO 的数据是现成的，不是从当前策略采的，没有 π<sub>old</sub>。π<sub>ref</sub> 只出现在隐式奖励里，不是重要性权重。"));
  }

  // ⑦ loss
  const avgLoss = mean(B.map(g => g.out.loss));
  if (algo === "ppo") {
    const all = B.flatMap(g => g.out.rows.flatMap(r => r.toks));
    const pl = mean(all.map(t => t.lossTok)), vl = mean(all.map(t => 0.5 * (t.V - t.ret) ** 2));
    cards.push(sec(7, "Loss：逐 token 的 PPO-clip + Value 回归", "[n·m, T] → 标量", `<p>ρ<sub>t</sub> 见 ⑥，loss<sub>t</sub> = −min(ρ<sub>t</sub>A<sub>t</sub>, clip(ρ<sub>t</sub>, 1±${S.eps})·A<sub>t</sub>)。斜纹格：ρ 已越界且方向和 A 一致，梯度为 0。整批 token 平均得到 policy loss；Value Model 另算 ½(V − R)²。</p>
${bmat(B, t => t.lossTok, { label: "loss<sub>t</sub>（斜纹 = 被 clip，梯度为 0）", d: 3, neutral: true, dead: t => !t.active })}
<p>policy loss = <span class="bigloss">${f(pl, 4)}</span> &nbsp; value loss = <span class="bigloss">${f(vl, 4)}</span></p>`));
  } else if (algo === "dpo") {
    cards.push(sec(7, "Loss：−log σ(margin)，每对一个", "[n] → 标量", `<p>梯度对整句均匀作用：y<sub>w</sub> 的每个 token 被推高 β(1−σ)，y<sub>l</sub> 的每个 token 被压低同样的量。</p>
${bmat(B, t => t.g, { label: "每个 token 的梯度系数", d: 3 })}
<table class="rt"><tr><th class="l">prompt</th><th>loss = −log σ(margin)</th></tr>${B.map(g => `<tr><td class="l">p${g.pi + 1}</td><td>${f(g.out.loss, 4)}</td></tr>`).join("")}</table>
<p>loss（n 对平均）= <span class="bigloss">${f(avgLoss, 4)}</span></p>`));
  } else if (algo === "gspo") {
    cards.push(sec(7, "Loss：整句 ratio s<sub>i</sub>，整句 clip", "[n·m] → 标量", `<p>s<sub>i</sub> = exp(每个 token 的 log ρ 取平均)，loss<sub>i</sub> = −min(s<sub>i</sub>A<sub>i</sub>, clip(s<sub>i</sub>, 1±${S.epsSeq})·A<sub>i</sub>)。被裁的回答<b>整行</b>梯度为 0；没被裁的回答里，每个 token 权重相同：s<sub>i</sub>·A<sub>i</sub>/(m·|y<sub>i</sub>|)。</p>
${bmat(B, (t, r) => t.active ? r.s * r.A / (m * r.L) : 0, { label: "每个 token 的梯度系数", d: 3, dead: t => !t.active })}

  const head = (x, t) => `<text x="${x}" y="28" font-size="13" font-weight="600" fill="#1d2330" text-anchor="middle">${t}</text>`;
  const body = rows.map((r, i) => {
    const y = top + i * RH, txt = r.g.toks.map(t => t.t).join("");
    const short = txt.length > 22 ? txt.slice(0, 22) + "…" : txt;
    const sq = r.g.toks.slice(0, 14).map((t, j) => `<rect x="${1078 + j * 8.6}" y="${y + 9}" width="7" height="18" rx="2" fill="${col(r.A)}" opacity="${Math.abs(r.A) < 1e-9 ? 1 : 0.35 + 0.65 * Math.min(1, Math.abs(r.A))}"/>`).join("");
    return `<g ${an(0.35 + i * 0.18)}><path d="M172,${mid + 5} C205,${mid + 5} 205,${y + 18} 238,${y + 18}" stroke="#7a4cd9" stroke-width="1.5" fill="none" marker-end="url(#arr2)"/>
<rect x="240" y="${y}" width="452" height="36" rx="8" fill="#fff" stroke="#d5d9e2"/>
<text x="252" y="${y + 23}" font-size="12" fill="#6b7385" font-family="monospace">o${i + 1}</text>
<text x="282" y="${y + 23}" font-size="14" fill="#1d2330">${short}</text>
<text x="682" y="${y + 23}" font-size="11" fill="#6b7385" text-anchor="end">${r.L} tok</text></g>
<g ${an(tR + i * 0.12)}><rect x="706" y="${y + 4}" width="72" height="28" rx="6" fill="${r.R > 0.5 ? "#e3f5ea" : "#fbe5e5"}"/>
<text x="742" y="${y + 23}" font-size="13" font-weight="700" text-anchor="middle" fill="${r.R > 0.5 ? "#1f9d55" : "#d64545"}" font-family="monospace">r=${r.R.toFixed(r.R % 1 ? 2 : 0)}</text></g>
<g ${an(tA + i * 0.1)}><path d="M940,${y + 18} L952,${y + 18}" stroke="#1d2330" stroke-width="1.2"/>
<rect x="954" y="${y + 4}" width="104" height="28" rx="6" fill="${fill(r.A)}"/>
<text x="1006" y="${y + 23}" font-size="13" font-weight="700" text-anchor="middle" fill="${col(r.A)}" font-family="monospace">A=${f(r.A, 2)}</text></g>
<g ${an(tT + i * 0.1)}><path d="M1060,${y + 18} L1074,${y + 18}" stroke="#1d2330" stroke-width="1.2" marker-end="url(#arr2)"/>${sq}${r.L > 14 ? `<text x="${1078 + 14 * 8.6}" y="${y + 23}" font-size="11" fill="#6b7385">…</text>` : ""}</g>`;
  }).join("");
  const y0 = top + 4, y1 = top + G * RH - 14;
  const stats = `<g ${an(tS)}><path d="M792,${y0} h8 V${y1} h-8" stroke="#1d2330" stroke-width="1.5" fill="none"/>
<text x="812" y="${mid - 6}" font-size="13" fill="#1d2330" font-family="monospace">mean = ${out.m.toFixed(2)}</text>
<text x="812" y="${mid + 14}" font-size="13" fill="${useStd ? "#1d2330" : "#a0a6b2"}" font-family="monospace">std = ${out.sd.toFixed(2)}${useStd ? "" : "（不用）"}</text>
<text x="812" y="${mid + 34}" font-size="11" fill="#6b7385">≈ V(s₀)</text></g>`;
  const zero = out.sd < 1e-9 ? `<text x="605" y="${H - 14}" font-size="13" fill="#d64545" text-anchor="middle" font-weight="600">全组同分 → 所有 A = 0 → 这道题没有梯度${algo === "dapo" ? "（DAPO 会把这组丢掉重采）" : ""}</text>` : "";
  return `<div class="card"><h2>GRPO 一族的核心：一个 prompt 采 G 条，组内求平均</h2>
<div class="controls">${slider("G", "G", 2, 8, 1)}<button class="btn" onclick="reseed()">🎲 重新采样</button><button class="btn" onclick="set('forceSame', !S.forceSame)">${S.forceSame ? "取消" : "强制"}全组同分</button><button class="btn" onclick="render(false)">▶ 重放动画</button></div>
<svg viewBox="0 0 1210 ${H}" style="width:100%;background:#fafbfc;border-radius:10px">
<defs><marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2330"/></marker></defs>
${head(95, "① 1 个 prompt")}${head(466, "② 复制 G 份，推理引擎各采一条")}${head(742, "③ 各打一个分")}${head(866, "④ 组内统计")}${head(1006, "⑤ 优势")}<text x="1006" y="45" font-size="11" fill="#6b7385" text-anchor="middle" font-family="monospace">${advLabel}</text>${head(1140, "⑥ 复制给每个 token")}
<g class="gp"><rect x="20" y="${mid - 30}" width="152" height="70" rx="10" fill="#fff" stroke="#2f6fed" stroke-width="2" stroke-dasharray="5 3"/>
<text x="96" y="${mid - 8}" font-size="11" fill="#6b7385" text-anchor="middle">prompt</text>
<text x="96" y="${mid + 16}" font-size="14" font-weight="600" fill="#1d2330" text-anchor="middle">${PROMPT}</text></g>
${body}${stats}${zero}</svg>
<p class="muted">同一道题采 G 条 → 每条一个整句分 → 组内均值当基线（相当于只估了起点的 V(s₀)）→ 每条一个优势 → 原样复制给它的所有 token（⑥ 里同一行颜色完全一样）。PPO 则是让 critic 给每个前缀估一个 V(s<sub>t</sub>)，所以同一行里每个 token 的优势都不同。${algo === "dapo" ? " DAPO 的分数含超长惩罚。" : ""}${algo === "forceSame" ? "" : ""}</p></div>`;
}
PAGES.arch = () => {
  const a = S.palgo;
  const dep = AR_DEPLOY[a];
  return `
<div class="card"><h2>训练架构：要部署哪几类模型，数据怎么流</h2>
<div class="controls">${Object.entries(PL_ALGOS).concat([["dpo", "DPO"]]).map(([k, v]) => `<button class="btn ${a === k ? "solid" : ""}" onclick="S.palgo='${k}';render(false)">${v}</button>`).join("")}</div>
${archSvg(a)}
<div class="legend" style="margin-top:8px">${Object.values(KIND).map(K => `<span style="--c:${K.c}">${K.tag}</span>`).join("")}<span><b>实线框 + 网络小图 = 模型</b>（有参数，要部署）：🔥 参数会更新 · ❄ 冻结 · ↻ 推理副本（权重随 Policy 同步）；<b>虚线框 = 不是模型</b>：圆柱 = 数据，齿轮 = CPU 计算；实线箭头 = <b>数据</b>（不是模型调用）：例如 ② 是把生成好的回答送进 Reference / Value Model 做一次前向；虚线箭头 = 权重同步；圆点按步骤号依次流动；淡掉的框 = 本方法不需要</span></div>
</div>
${groupPanel(a)}
<div class="two">
<div class="card"><h2>一次迭代</h2><ol class="steps">${AR_STEPS[a].map(s => `<li>${s}</li>`).join("")}</ol></div>
<div class="card"><h2>要部署什么（共 ${dep.length} 类）</h2>
<table><tr><th class="l">组件</th><th class="l">状态</th><th class="l">显存（以 Policy Model 为 1 份）</th></tr>${dep.map(r => `<tr>${r.map(c => `<td class="l">${c}</td>`).join("")}</tr>`).join("")}</table>
<p class="muted">粗略量级：训练一个模型（bf16 权重和梯度 + fp32 Adam 状态和主权重）约每参数 16 字节；只做前向约每参数 2 字节。以 7B 为例，训练约 112 GB（不含激活），推理约 14 GB 加 KV cache。所以 PPO 多出来的 Value Model 是一笔大开销，这也是 GRPO 想去掉它的原因。</p>
<div class="note">实际部署有两种排法：<b>共置</b>（如 verl 的 hybrid engine，Policy Model 训练和 Rollout Model 共用同一组 GPU，轮流切换，权重同步在本机完成）；<b>分离</b>（推理集群和训练集群分开，按异步或流水线方式跑，权重同步要跨机广播）。Reference Model 和 Reward Model 可以和 Policy Model 放在同一组卡上分时使用，也可以单独作为服务部署。</div>
</div></div>`;
};

// ============================================================
function render(withAnim) {
  nav();
  document.getElementById("main").innerHTML = PAGES[S.algo]();
  const tok = ++S.animToken;
  if (withAnim) animate(tok);
  history.replaceState(null, "", "#" + S.algo + (S.algo === "calc" ? ":" + S.calcAlgo : S.algo === "arch" ? ":" + S.palgo : ""));
}
const [initial, hSub] = location.hash.slice(1).split(":");
if (initial === "arch" && AR_USE[hSub]) S.palgo = hSub;
if (initial === "calc" && ALGOS.some(a => a.k === hSub)) S.calcAlgo = hSub;
if (ALGOS.some(a => a.k === initial)) { S.calcAlgo = initial; S.algo = "calc"; }
else if (PAGES[initial]) S.algo = initial;
render(true);
</script>
</body>
</html>
