<header>
  <h1>230 种空间群：三维晶体的全部对称类型</h1>
  <p>白-红-蓝三个小球组成一个<b>不对称</b>的"分子"（三维版的字母 F）。选一个空间群，它被该群的全部操作（旋转、镜面、反演、螺旋轴、滑移面 + 平移）复制满一个晶胞。拖动旋转，滚轮缩放。副本互为镜像的，就是群里有反演/镜面/滑移的证据。</p>
</header>

// ---------- 晶系与晶胞 ----------
const sysName = n => n<=2?'三斜':n<=15?'单斜':n<=74?'正交':n<=142?'四方':n<=167?'三方':n<=194?'六方':'立方';
function cellParams(n){
  if(n<=2)  return [1,1.15,0.9, 95,85,100];
  if(n<=15) return [1,0.85,1.15, 90,105,90];
  if(n<=74) return [1.15,0.85,1.3, 90,90,90];
  if(n<=142)return [1,1,1.35, 90,90,90];
  if(n<=194)return [1,1,1.2, 90,90,120];
  return [1,1,1, 90,90,90];
}
function cellMatrix(p){
  const [A,B,C,al,be,ga]=p, r=x=>x*Math.PI/180;
  const ca=Math.cos(r(al)), cb=Math.cos(r(be)), cg=Math.cos(r(ga)), sg=Math.sin(r(ga));
  const cx=C*cb, cy=C*(ca-cb*cg)/sg;
  const cz=Math.sqrt(Math.max(0,C*C-cx*cx-cy*cy));
  return [[A,0,0],[B*cg,B*sg,0],[cx,cy,cz]];   // 行 = 基向量 a,b,c
}
const f2c=(f,M)=>[0,1,2].map(k=> f[0]*M[0][k]+f[1]*M[1][k]+f[2]*M[2][k]);

// ---------- 解码对称操作 ----------
const MAP={'-':-1,'0':0,'+':1};
function decodeOp(s){
  const R=[...s.slice(0,9)].map(ch=>MAP[ch]);
  const t=[...s.slice(9)].map(ch=>'0123456789ab'.indexOf(ch)/12);
  return {R,t};
}
const applyOp=(o,f)=>[
  o.R[0]*f[0]+o.R[1]*f[1]+o.R[2]*f[2]+o.t[0],
  o.R[3]*f[0]+o.R[4]*f[1]+o.R[5]*f[2]+o.t[1],
  o.R[6]*f[0]+o.R[7]*f[1]+o.R[8]*f[2]+o.t[2]];
const wrap=x=>((x%1)+1)%1;

// ---------- 分子（不对称三球） ----------
const CENTER=[0.13,0.09,0.06];
const OFFS=[[0,0,0],[0.10,0.02,0.012],[0.03,0.085,0.05]];
const RADII=[0.048,0.034,0.026];
const ACOL=['#d8d5ca','#e74c3c','#3f8fd2'];

// ---------- 视图状态 ----------
let idx=224;                       // 默认 #225 Fm-3m
let yaw=0.7, pitch=0.42, zoom=270;
const cv=document.getElementById('view'), ctx=cv.getContext('2d');

function render(){
  const g=SG[idx];
  const M=cellMatrix(cellParams(g.n));
  const ops=g.o.map(decodeOp);
  const colorize=document.getElementById('colorize').checked;
  const sticks=document.getElementById('sticks').checked;
  const cells8=document.getElementById('cells8').checked;
  const W=cv.width, H=cv.height;
  ctx.clearRect(0,0,W,H);
  const cc=f2c([0.5,0.5,0.5],M);
  const cellsN = cells8?2:1;
  const ctr = f2c([cellsN/2,cellsN/2,cellsN/2],M);
  const cy0=Math.cos(yaw), sy0=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const proj=q=>{
    const x=q[0]-ctr[0], y=q[1]-ctr[1], z=q[2]-ctr[2];
    const x1=x*cy0+z*sy0, z1=-x*sy0+z*cy0;
    const y2=y*cp-z1*sp, z2=y*sp+z1*cp;
    return [W/2+x1*zoom, H/2-y2*zoom, z2];
  };
  // 晶胞棱
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1;
  for(let ci=0;ci<cellsN;ci++)for(let cj=0;cj<cellsN;cj++)for(let ck=0;ck<cellsN;ck++){
    const C8=[];
    for(const dx of[0,1])for(const dy of[0,1])for(const dz of[0,1]) C8.push(proj(f2c([ci+dx,cj+dy,ck+dz],M)));
    const E=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
    for(const [a,b] of E){ ctx.beginPath(); ctx.moveTo(C8[a][0],C8[a][1]); ctx.lineTo(C8[b][0],C8[b][1]); ctx.stroke(); }
  }
  // 收集所有球和连杆
  const items=[];
  ops.forEach((op,oi)=>{
    const c1=applyOp(op,CENTER);
    const off=[wrap(c1[0])-c1[0], wrap(c1[1])-c1[1], wrap(c1[2])-c1[2]];
    for(let ci=0;ci<cellsN;ci++)for(let cj=0;cj<cellsN;cj++)for(let ck=0;ck<cellsN;ck++){
      const pts=OFFS.map(d=>{
        const f=applyOp(op,[CENTER[0]+d[0],CENTER[1]+d[1],CENTER[2]+d[2]]);
        return proj(f2c([f[0]+off[0]+ci, f[1]+off[1]+cj, f[2]+off[2]+ck],M));
      });
      const hue=(oi*360/ops.length)|0;
      if(sticks) for(const [a,b] of [[0,1],[0,2]])
        items.push({z:(pts[a][2]+pts[b][2])/2, stick:[pts[a],pts[b]],
                    col: colorize?`hsl(${hue} 45% 38%)`:'#555'});
      pts.forEach((p,ai)=>items.push({z:p[2], p, r:RADII[ai]*zoom,
        col: colorize?`hsl(${hue} 62% ${[72,55,45][ai]}%)`:ACOL[ai]}));
    }
  });
  items.sort((a,b)=>a.z-b.z);
  for(const it of items){
    if(it.stick){ ctx.strokeStyle=it.col; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.moveTo(it.stick[0][0],it.stick[0][1]); ctx.lineTo(it.stick[1][0],it.stick[1][1]); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(it.p[0],it.p[1],Math.max(1.5,it.r),0,6.283);
      ctx.fillStyle=it.col; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.45)'; ctx.lineWidth=1; ctx.stroke();
    }
  }
  document.getElementById('info').innerHTML =
    `<b>#${g.n} &nbsp;${g.s}</b>（${sysName(g.n)}晶系）<br>`+
    `每个晶胞 <b>${g.o.length}</b> 份副本<br>`+
    `<span style="color:#9a97a8">二维时这个数字最多 12（p6m）；三维封顶 192。</span>`;
}

// ---------- 交互 ----------
let dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{ if(!dragging)return;
  yaw+=(e.clientX-lx)*.008; pitch+=(e.clientY-ly)*.008;
  pitch=Math.max(-1.5,Math.min(1.5,pitch)); lx=e.clientX; ly=e.clientY; });
cv.addEventListener('pointerup',()=>dragging=false);
cv.addEventListener('wheel',e=>{e.preventDefault(); zoom*=Math.exp(-e.deltaY*.001); zoom=Math.max(60,Math.min(900,zoom));},{passive:false});

const sel=document.getElementById('sgsel');
SG.forEach((g,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`#${g.n}  ${g.s}  (${g.o.length}份)`; sel.appendChild(o); });
sel.value=idx;
sel.onchange=()=>{ idx=+sel.value; };
function step(d){ idx=(idx+d+230)%230; sel.value=idx; }
document.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=()=>{});

const FAMOUS=[
 [0,  'P1 —— 三维的 p1，只有平移'],
 [1,  'P-1 —— 加一个反演中心'],
 [13, 'P2₁/c —— 有机分子晶体最爱'],
 [18, 'P2₁2₁2₁ —— 蛋白质晶体第一名'],
 [151,'P3₁21 —— 石英（左旋）'],
 [153,'P3₂21 —— 石英（右旋，镜像兄弟）'],
 [193,'P6₃/mmc —— 密排六方金属'],
 [220,'Pm-3m —— CsCl / 钙钛矿'],
 [224,'Fm-3m —— 食盐 NaCl，192 份'],
 [226,'Fd-3m —— 钻石',],
 [229,'Ia-3d —— 石榴石 / 螺旋二十四面体'],
];
const qb=document.getElementById('qbtns');
FAMOUS.forEach(([i,label])=>{ const b=document.createElement('button');
  b.textContent=label; b.onclick=()=>{ idx=i; sel.value=i; }; qb.appendChild(b); });

(function loop(){
  if(document.getElementById('spin').checked && !dragging) yaw+=0.004;
  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
